<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="関数LAB">
<meta name="theme-color" content="#16324F">
<link rel="icon" href="https://shimeji-lab.github.io/manabi-lab/favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="https://shimeji-lab.github.io/manabi-lab/favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="https://shimeji-lab.github.io/manabi-lab/apple-touch-icon.png?v=1">
<title>関数LAB</title>
<style>
  :root{
    --ink:#16324F;
    --ink-soft:#5C7996;
    --paper:#F7FAFC;
    --grid:#DFE9F1;
    --line:#C6D6E3;
    --amber:#E0982C;
    --amber-ink:#B87516;
    --amber-soft:#FBEED6;
    --blue:#2F7BB0;
    --blue-soft:#BCDDF0;
    --card:#FFFFFF;
    --ok:#2E8B57;
    --mono: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
    --gothic: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  button{touch-action:manipulation; min-height:44px; font-family:var(--gothic); cursor:pointer}
  button:focus-visible, input:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  body{
    margin:0;
    padding:16px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-tap-highlight-color:transparent;
    font-family:var(--gothic); color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .app{max-width:1080px; margin:0 auto}
  .hidden{display:none !important}

  .back{display:inline-block; font-size:13px; color:var(--ink-soft); text-decoration:none; margin-bottom:8px}
  .back:hover{color:var(--ink); text-decoration:underline}
  header{margin-bottom:10px; border-bottom:2.5px solid var(--ink); padding-bottom:10px}
  h1{font-size:25.5px; margin:0; letter-spacing:.08em; font-weight:700}
  h1 span{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.24em; color:var(--ink-soft); font-weight:400; margin-top:4px}

  /* 章タブ（1段） */
  .chapters{display:flex; gap:6px; margin:12px 0 10px; max-width:640px}
  .chapters button{
    flex:1; min-width:0; border:1.5px solid var(--line); background:#fff; border-radius:3px;
    padding:5px 2px 7px; color:var(--ink-soft); font-size:12px; font-weight:700; line-height:1.3; min-height:50px;
  }
  .chapters button b{display:block; font-family:var(--mono); font-size:16px}
  .chapters button.active{background:var(--ink); border-color:var(--ink); color:#fff}
  .chapters button.soon{border-style:dashed}
  .chq{margin:0 0 12px}
  .chq h2{font-size:18px; margin:0; letter-spacing:.03em; line-height:1.45}
  .chq p{font-size:13px; color:var(--ink-soft); margin:4px 0 0; line-height:1.6}

  .card{background:var(--card); border:1.5px solid var(--line); border-radius:3px; padding:12px 14px}
  .card + .card{margin-top:10px}
  .card h3{font-size:13px; margin:0 0 6px; letter-spacing:.14em; color:var(--ink-soft); font-weight:700}

  /* ミッション */
  .mission{border-color:var(--amber); background:#fff}
  .mission-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .mission-head h3{margin:0 4px 0 0; color:var(--amber-ink)}
  .mchip{
    min-height:38px; min-width:44px; padding:4px 10px; font-size:13px; font-weight:700;
    background:#fff; color:var(--ink); border:1.5px solid var(--line); border-radius:3px;
  }
  .mchip.active{background:var(--ink); border-color:var(--ink); color:#fff}
  .mchip.done::after{content:" ✓"; color:var(--ok)}
  .mchip.active.done::after{color:#9FE0B9}
  .mbody{margin-top:10px; border-top:1px solid var(--line); padding-top:10px}
  .mq{font-size:15.5px; font-weight:700; margin:0; line-height:1.55}
  .mset{font-size:12.5px; color:var(--ink-soft); margin:4px 0 8px; line-height:1.6}
  .choices{display:grid; gap:6px}
  .choice{
    text-align:left; font-size:14px; padding:8px 12px; background:#fff; color:var(--ink);
    border:1.5px solid var(--line); border-radius:3px; line-height:1.45;
  }
  .choice.picked{background:var(--ink); border-color:var(--ink); color:#fff}
  .choice.right{border-color:var(--ok); box-shadow:inset 4px 0 0 var(--ok)}
  .choice:disabled{cursor:default}
  .mactions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .mresult{margin:10px 0 0; font-size:13.5px; line-height:1.7; padding:8px 12px; border-radius:3px; background:var(--amber-soft); border:1.5px solid var(--amber)}
  .mresult b{font-size:14.5px}

  .play-btn{
    font-size:15px; padding:6px 18px; background:var(--amber-soft); color:var(--ink);
    border:1.5px solid var(--amber); border-radius:3px; font-weight:700;
  }
  .play-btn:hover{background:var(--amber); color:#fff}
  .play-btn:disabled{opacity:.45; cursor:default; background:var(--amber-soft); color:var(--ink)}
  .tool-btn{font-size:14px; padding:6px 12px; background:#fff; border:1.5px solid var(--line); border-radius:3px; color:var(--ink)}
  .tool-btn:hover{border-color:var(--ink)}

  /* レイアウト */
  .lab{display:grid; gap:10px; margin-top:10px}
  .stage{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:6px}
  svg{display:block; width:100%; height:auto}
  .timebar{display:flex; align-items:center; gap:8px; margin-top:6px; padding:0 4px}
  .timebar .play-btn{flex:0 0 auto; min-width:92px}
  .timebar .tool-btn{flex:0 0 auto}
  .timebar .tv{margin-left:auto; font-family:var(--mono); font-size:17px; white-space:nowrap}

  input[type=range]{
    width:100%; margin:2px 0 0; height:36px; background:transparent;
    -webkit-appearance:none; appearance:none; touch-action:pan-y;
  }
  input[type=range]::-webkit-slider-runnable-track{height:8px; border-radius:4px; background:#E6EFF5; border:1px solid var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:30px; height:30px; margin-top:-12px; border-radius:50%;
    background:#1B6FA8; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(22,50,79,.35);
  }
  input[type=range]::-moz-range-track{height:8px; border-radius:4px; background:#E6EFF5; border:1px solid var(--line)}
  input[type=range]::-moz-range-thumb{width:26px; height:26px; border:2.5px solid #fff; border-radius:50%; background:#1B6FA8}
  input.amber::-webkit-slider-thumb{background:var(--amber)}
  input.amber::-moz-range-thumb{background:var(--amber)}
  input.blue::-webkit-slider-thumb{background:var(--blue)}
  input.blue::-moz-range-thumb{background:var(--blue)}
  .range-ends{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--ink-soft)}
  .time-range{padding:0 4px}

  /* 式 */
  .result{background:var(--ink); color:#fff; border-radius:3px; padding:12px 14px}
  .result h3{font-size:12.5px; letter-spacing:.14em; color:#9FBBD4; margin:0 0 4px; font-weight:400}
  .formula{font-family:var(--mono); font-size:26px; font-weight:700; margin:0; letter-spacing:.02em}
  .ca{color:#F2B65A}
  .cb{color:#8FC8EE}
  .subst{font-family:var(--mono); font-size:14.5px; color:#D6E5F2; margin:6px 0 0; line-height:1.7; word-break:break-all}
  .subst .y{color:#fff; font-weight:700}
  .note{font-size:12.5px; color:#D6E5F2; line-height:1.7; margin:8px 0 0; border-top:1px solid #35577A; padding-top:7px}
  .note .tagp{display:inline-block; font-size:11px; padding:1px 7px; border:1px solid #8FC8EE; color:#8FC8EE; border-radius:2px; margin-right:4px}

  /* 表 */
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{border-collapse:collapse; font-family:var(--mono); font-size:12.5px; width:100%; min-width:320px}
  th, td{border:1px solid var(--line); padding:5px 2px; text-align:center; min-width:24px; transition:background .15s, color .15s, opacity .15s}
  th{font-family:var(--gothic); font-size:11px; color:var(--ink-soft); font-weight:700; background:#F1F6FA; white-space:nowrap; padding:5px 4px}
  td.future{opacity:.35}
  td.now{background:var(--amber); color:#fff; font-weight:700; border-color:var(--amber)}
  .rate{font-size:12.5px; color:var(--ink-soft); margin:6px 0 0}
  .rate b{color:var(--amber-ink); font-family:var(--mono)}

  /* 変える */
  .field label{display:flex; justify-content:space-between; align-items:center; font-size:13.5px; color:var(--ink); gap:8px}
  .field .val{font-family:var(--mono); font-size:19px; font-weight:700; white-space:nowrap}
  .field + .field{margin-top:6px}
  .sym{display:inline-block; font-family:var(--mono); font-weight:700; padding:0 6px; border-radius:2px; color:#fff; margin-right:4px}
  .sym.a{background:var(--amber)}
  .sym.b{background:var(--blue)}
  .row-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

  .soonbox{text-align:center; padding:28px 16px; border-style:dashed}
  .soonbox .tag{display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; padding:3px 9px; border:1px solid var(--amber); background:var(--amber-soft); color:var(--amber-ink); border-radius:2px}
  .soonbox p{font-size:14px; line-height:1.75; color:var(--ink-soft); margin:12px 0 0}

  .mchips{display:flex; gap:6px; flex-wrap:wrap}
  td.near{background:var(--amber-soft)}
  tr.prod td{color:var(--amber-ink); font-weight:700}
  tr.prod td.now{color:#fff}
  /* 分数 */
  .fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:.72em; line-height:1.1; margin:0 2px}
  .fr > span:first-child{border-bottom:2px solid #fff; padding:0 4px 1px}
  .fr > span:last-child{padding-top:1px}
  /* 面積 a のえらびボタン */
  .seg{display:flex; gap:6px; margin-top:6px}
  .segbtn{flex:1; font-size:15px; font-family:var(--mono); font-weight:700; background:#fff; color:var(--ink); border:1.5px solid var(--line); border-radius:3px; padding:4px 6px}
  .segbtn.active{background:var(--ink); border-color:var(--ink); color:#fff}

  footer{margin-top:18px; font-size:11.5px; color:var(--ink-soft); font-family:var(--mono); text-align:right}

  @media (min-width:900px){
    .lab{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start}
    .lab .left{position:sticky; top:12px}
    .formula{font-size:30px}
  }
  @media (max-width:400px){
    .chapters button{font-size:11px}
    .chq h2{font-size:16.5px}
    h1{font-size:23px}
    .formula{font-size:23px}
  }
</style>
</head>
<body>
<div class="app">
  <a class="back" href="https://shimeji-lab.github.io/manabi-lab/">← まなびラボ</a>
  <header>
    <h1>関数LAB<span>FUNCTION LAB</span></h1>
  </header>

  <nav class="chapters" aria-label="章">
    <button data-ch="1" class="active"><b>1</b>一次関数</button><button data-ch="2"><b>2</b>反比例</button><button data-ch="3" class="soon"><b>3</b>動く点</button><button data-ch="4" class="soon"><b>4</b>y=ax²</button>
  </nav>
  <div class="chq"><h2 id="chQ"></h2><p id="lead"></p></div>

  <!-- ===== 章1 ===== -->
  <section id="ch1">
    <section class="card mission" id="missionCard">
      <div class="mission-head">
        <h3>ミッション</h3>
        <div id="mchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="mbody hidden" id="mbody">
        <p class="mq" id="mq"></p>
        <p class="mset" id="mset"></p>
        <div class="choices" id="mchoices"></div>
        <div class="mactions">
          <button class="play-btn" id="mcheck" disabled>確かめる ▶</button>
          <button class="tool-btn" id="mclose">閉じる</button>
        </div>
        <div class="mresult hidden" id="mresult"></div>
      </div>
    </section>

    <div class="lab">
      <div class="left">
        <section class="stage">
          <svg id="scene" viewBox="0 0 360 268" role="img" aria-label="水そうの水面の高さと、そのグラフ">
            <g id="gGrid"></g>
            <g id="gTank"></g>
            <g id="gGraph"></g>
          </svg>
          <div class="timebar">
            <button class="play-btn" id="btnPlay">▶ 再生</button>
            <button class="tool-btn" id="btnReset">最初から</button>
            <span class="tv" id="tv">x = 0 分</span>
          </div>
          <div class="time-range">
            <input type="range" id="tR" min="0" max="10" step="0.1" value="0" aria-label="時間 x（分）">
            <div class="range-ends"><span>0分</span><span>時間 x を動かす</span><span>10分</span></div>
          </div>
        </section>
      </div>

      <div class="right">
        <section class="result">
          <h3>式</h3>
          <p class="formula" id="formula"></p>
          <p class="subst" id="subst"></p>
          <p class="note" id="fnote"></p>
        </section>

        <section class="card" style="margin-top:10px">
          <h3>表</h3>
          <div class="tablewrap"><table id="tbl"></table></div>
          <p class="rate" id="rate"></p>
        </section>

        <section class="card">
          <h3>変えてみる</h3>
          <div class="field">
            <label for="aR"><span><i class="sym a">a</i>1分で上がる高さ（かたむき）</span><span class="val ca2" id="aV"></span></label>
            <input type="range" class="amber" id="aR" min="0.5" max="5" step="0.5" value="2">
            <div class="range-ends"><span>0.5</span><span>5</span></div>
          </div>
          <div class="field">
            <label for="bR"><span><i class="sym b">b</i>最初から入っている水（切片）</span><span class="val" id="bV"></span></label>
            <input type="range" class="blue" id="bR" min="0" max="20" step="1" value="6">
            <div class="range-ends"><span>0</span><span>20</span></div>
          </div>
          <div class="row-btns">
            <button class="tool-btn" id="btnGhost">くらべる線を消す</button>
          </div>
        </section>
      </div>
    </div>
  </section>

  <!-- ===== 章2：反比例 ===== -->
  <section id="ch2" class="hidden">
    <section class="card mission">
      <div class="mission-head">
        <h3>ミッション</h3>
        <div class="mchips" id="rmchips"></div>
      </div>
      <div class="mbody hidden" id="rmbody">
        <p class="mq" id="rmq"></p>
        <p class="mset" id="rmset"></p>
        <div class="choices" id="rmchoices"></div>
        <div class="mactions">
          <button class="play-btn" id="rmcheck" disabled>確かめる ▶</button>
          <button class="tool-btn" id="rmclose">閉じる</button>
        </div>
        <div class="mresult hidden" id="rmresult"></div>
      </div>
    </section>

    <div class="lab">
      <div class="left">
        <section class="stage" id="rstage">
          <svg id="rscene" viewBox="0 0 360 268" role="img" aria-label="面積が決まった長方形と、そのグラフ">
            <defs><pattern id="rtile" patternUnits="userSpaceOnUse"></pattern></defs>
            <g id="rGrid"></g>
            <g id="rRect"></g>
            <g id="rGraph"></g>
          </svg>
          <div class="timebar">
            <button class="play-btn" id="rPlay">▶ 横をのばす</button>
            <button class="tool-btn" id="rReset">x = 1 に</button>
            <span class="tv" id="rtv">x = 1 cm</span>
          </div>
          <div class="time-range">
            <input type="range" id="rX" min="1" max="12" step="0.5" value="3" aria-label="横 x（cm）">
            <div class="range-ends"><span>1cm</span><span>横 x を動かす</span><span>12cm</span></div>
          </div>
        </section>
      </div>

      <div class="right">
        <section class="result">
          <h3>式</h3>
          <p class="formula" id="rformula"></p>
          <p class="subst" id="rsubst"></p>
          <p class="note" id="rnote"></p>
        </section>

        <section class="card" style="margin-top:10px">
          <h3>表</h3>
          <div class="tablewrap"><table id="rtbl"></table></div>
          <p class="rate" id="rrate"></p>
        </section>

        <section class="card">
          <h3>変えてみる</h3>
          <div class="field">
            <label><span><i class="sym a">a</i>長方形の面積（比例定数）</span><span class="val" id="raV"></span></label>
            <div class="seg" id="rseg">
              <button class="segbtn" data-a="6">6</button><button class="segbtn" data-a="12">12</button><button class="segbtn" data-a="24">24</button>
            </div>
          </div>
          <div class="row-btns">
            <button class="tool-btn" id="rGhost">くらべる線を消す</button>
          </div>
        </section>
      </div>
    </div>
  </section>

  <!-- ===== 章3〜4（準備中） ===== -->
  <section id="chSoon" class="card soonbox hidden">
    <span class="tag">準備中</span>
    <p id="soonText"></p>
  </section>

  <footer>関数LAB <span id="ver"></span></footer>
</div>

<script>
(function(){
  "use strict";
  const VERSION = 'v0.2.0';
  document.getElementById('ver').textContent = VERSION;

  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const fmt = v => String(+(+v).toFixed(2));          // 3.50 → "3.5"
  const fmtT = v => String(+(+v).toFixed(1));

  /* ---------- 章 ---------- */
  const CHAPTER = {
    1: ['水を入れる時間と、水面の高さには、どんなきまりがある？',
        '時間 x を動かして、水面・表・式・グラフが同じ数を指しているか確かめよう。'],
    2: ['面積が同じ長方形。横をのばすと、たてはどうなる？',
        '横 x を動かして、長方形・表・式・グラフを見くらべよう。x × y はいつも同じ？'],
    3: ['図形の辺の上を動く点。三角形の面積はどう変わる？', ''],
    4: ['坂を転がる玉。進むきょりは、時間の何倍で増える？', '']
  };
  const SOON = {
    2: '反比例 y = a/x を、面積が決まった長方形の形を変えて確かめる章です。',
    3: '点が長方形の辺の上を動くとき、できる三角形の面積を、折れ線のグラフで確かめる章です。',
    4: '坂を転がる玉の進むきょり y = ax² を、放物線のグラフで確かめる章です。'
  };
  let chapter = 1, R2 = null;
  function setChapter(n){
    chapter = n;
    document.querySelectorAll('.chapters button').forEach(b => b.classList.toggle('active', +b.dataset.ch === n));
    $('chQ').textContent = CHAPTER[n][0];
    const ready = n <= 2;
    $('lead').textContent = ready ? CHAPTER[n][1] : 'この章は準備中です。';
    $('ch1').classList.toggle('hidden', n !== 1);
    $('ch2').classList.toggle('hidden', n !== 2);
    $('chSoon').classList.toggle('hidden', ready);
    $('soonText').textContent = SOON[n] || '';
    if (n !== 1 && S.playing) pause();
    if (n !== 2 && R2 && R2.S.playing) R2.stop();
  }
  document.querySelectorAll('.chapters button').forEach(b => b.addEventListener('click', () => setChapter(+b.dataset.ch)));

  /* ---------- 座標（水そうとグラフは同じ縦の目もり：1cm = 3px） ---------- */
  const G = {
    y0: 236, py: 3,          // y=0 の位置、1cmあたりのpx
    x0: 134, px: 20,         // グラフの x=0 の位置、1分あたりのpx
    tankL: 22, tankR: 92,
    Ymax: 70, Xmax: 10
  };
  const Y = v => G.y0 - G.py * v;
  const X = t => G.x0 + G.px * t;

  /* ---------- 状態 ---------- */
  const S = { a: 2, b: 6, t: 0, playing: false, ghost: null };
  const yOf = (t, a = S.a, b = S.b) => a * t + b;

  /* ---------- SVG 部品 ---------- */
  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(s, attrs, parent){ const e = el('text', attrs, parent); e.textContent = s; return e; }

  // 方眼とじく
  const gGrid = $('gGrid');
  for (let v = 0; v <= G.Ymax; v += 10){
    el('line', {x1:G.x0, x2:X(G.Xmax), y1:Y(v), y2:Y(v), stroke: v ? '#E3ECF3' : '#16324F', 'stroke-width': v ? 1 : 1.5}, gGrid);
    if (v) txt(v, {x:G.x0 - 5, y:Y(v) + 3.5, 'text-anchor':'end', 'font-size':9.5, fill:'#5C7996', 'font-family':'Consolas,monospace'}, gGrid);
    // 水そうの目もり
    el('line', {x1:G.tankR, x2:G.tankR - 6, y1:Y(v), y2:Y(v), stroke:'#16324F', 'stroke-width':1}, gGrid);
  }
  for (let t = 0; t <= G.Xmax; t++){
    el('line', {x1:X(t), x2:X(t), y1:Y(0), y2:Y(G.Ymax), stroke: t ? '#E3ECF3' : '#16324F', 'stroke-width': t ? 1 : 1.5}, gGrid);

  }
  txt('y(cm)', {x:G.x0 - 4, y:Y(G.Ymax) - 7, 'text-anchor':'middle', 'font-size':9.5, fill:'#16324F', 'font-weight':700}, gGrid);
  txt('x(分)', {x:X(G.Xmax) + 2, y:Y(0) + 26, 'text-anchor':'end', 'font-size':9.5, fill:'#16324F', 'font-weight':700}, gGrid);
  txt('O', {x:G.x0 - 5, y:Y(0) + 13, 'text-anchor':'end', 'font-size':9.5, fill:'#5C7996'}, gGrid);

  // 水そう
  const gTank = $('gTank');
  const waterB = el('rect', {x:G.tankL, width:G.tankR - G.tankL, fill:'#9CCBEA'}, gTank);   // 最初の水
  const waterA = el('rect', {x:G.tankL, width:G.tankR - G.tankL, fill:'#BCDDF0', id:'water'}, gTank); // 入れた水
  const stream = el('rect', {x:G.tankL + 16 - 2.5, width:5, fill:'#9CCBEA', y:Y(G.Ymax) - 2}, gTank);
  el('path', {d:`M${G.tankL} ${Y(G.Ymax) - 4} V${Y(0)} H${G.tankR} V${Y(G.Ymax) - 4}`, fill:'none', stroke:'#16324F', 'stroke-width':2.5}, gTank);

  el('path', {d:`M4 ${Y(G.Ymax) - 18} H${G.tankL + 16} V${Y(G.Ymax) - 8}`, fill:'none', stroke:'#16324F', 'stroke-width':6, 'stroke-linejoin':'round'}, gTank);
  el('path', {d:`M4 ${Y(G.Ymax) - 18} H${G.tankL + 16} V${Y(G.Ymax) - 8}`, fill:'none', stroke:'#C6D6E3', 'stroke-width':3, 'stroke-linejoin':'round'}, gTank);

  // グラフ
  const gGraph = $('gGraph');

  const dot = el('circle', {r:6.5, fill:'#E0982C', stroke:'#fff', 'stroke-width':2, id:'dot'}, gGraph);
  const readout = txt('', {x:X(G.Xmax), y:Y(G.Ymax) - 7, 'text-anchor':'end', 'font-size':11, fill:'#16324F', 'font-weight':700, 'font-family':'Consolas,monospace', id:'readout'}, gGraph);

  /* ---------- 表 ---------- */
  const tbl = $('tbl');
  const trX = document.createElement('tr'), trY = document.createElement('tr');
  trX.innerHTML = '<th>x（分）</th>'; trY.innerHTML = '<th>y（cm）</th>';
  const cellsX = [], cellsY = [];

  }
  tbl.appendChild(trX); tbl.appendChild(trY);

  /* ---------- 描画 ---------- */
  function render(){
    const {a, b} = S;
    const t = Math.round(S.t * 10) / 10;   // 表示する時間は 0.1分きざみにそろえる
    const y = yOf(t);

    // 水そう
    waterB.setAttribute('y', Y(b)); waterB.setAttribute('height', G.py * b);
    waterA.setAttribute('y', Y(y)); waterA.setAttribute('height', G.py * (y - b));
    bLine.setAttribute('y1', Y(b)); bLine.setAttribute('y2', Y(b));
    bLbl.setAttribute('y', Y(b) + 11); bLbl.style.display = b >= 4 ? '' : 'none';
    const flowing = S.playing && t < G.Xmax;
    stream.setAttribute('height', Math.max(0, Y(y) - (Y(G.Ymax) - 8)));
    stream.setAttribute('y', Y(G.Ymax) - 8);
    stream.style.display = flowing ? '' : 'none';

    // グラフ
    line.setAttribute('x1', X(0)); line.setAttribute('y1', Y(b));
    line.setAttribute('x2', X(t)); line.setAttribute('y2', Y(y));
    bDot.setAttribute('cy', Y(b));
    dot.setAttribute('cx', X(t)); dot.setAttribute('cy', Y(y));
    guideH.setAttribute('x1', G.tankR); guideH.setAttribute('x2', X(t));
    guideH.setAttribute('y1', Y(y)); guideH.setAttribute('y2', Y(y));
    guideV.setAttribute('x1', X(t)); guideV.setAttribute('x2', X(t));
    guideV.setAttribute('y1', Y(y)); guideV.setAttribute('y2', Y(0));
    readout.textContent = `x=${fmtT(t)}  y=${fmt(y)}`;

    // かたむきの三角（x=1→2 の区間。線がそこまで描かれたら出す）
    if (t >= 2){
      const x1 = X(1), x2 = X(2), y1 = Y(yOf(1)), y2 = Y(yOf(2));
      slopeTri.setAttribute('d', `M${x1} ${y1} H${x2} V${y2}`);
      slopeLbl.setAttribute('x', x2 + 3); slopeLbl.setAttribute('y', (y1 + y2) / 2 + 3.5);
      slopeLbl.textContent = '+' + fmt(a);
      slopeTri.style.display = slopeLbl.style.display = '';
    } else { slopeTri.style.display = slopeLbl.style.display = 'none'; }

    // くらべる線
    if (S.ghost){
      const g = S.ghost;
      ghostLine.setAttribute('x1', X(0)); ghostLine.setAttribute('y1', Y(g.b));
      ghostLine.setAttribute('x2', X(G.Xmax)); ghostLine.setAttribute('y2', Y(yOf(G.Xmax, g.a, g.b)));
      ghostLbl.textContent = '前：' + formulaText(g.a, g.b);
      const ge = yOf(G.Xmax, g.a, g.b);
      ghostLbl.setAttribute('x', X(G.Xmax) - 2); ghostLbl.setAttribute('text-anchor', 'end');
      ghostLbl.setAttribute('y', Math.max(Y(G.Ymax) + 22, Y(ge) + 13));
      ghostLine.style.display = ghostLbl.style.display = '';
    } else { ghostLine.style.display = ghostLbl.style.display = 'none'; }

    // 表
    const now = Math.floor(t + 1e-9);
    cellsY.forEach((c, x) => {
      c.textContent = fmt(yOf(x));
      c.classList.toggle('now', x === now);
      c.classList.toggle('future', x > t + 1e-9);
      cellsX[x].classList.toggle('now', x === now);
      cellsX[x].classList.toggle('future', x > t + 1e-9);
    });
    $('rate').innerHTML = `x が 1 ふえると、y は いつも <b>+${fmt(a)}</b> cm（変化の割合 ＝ a）`;

    // 式
    $('formula').innerHTML = formulaHTML(a, b);
    $('subst').innerHTML = `x = ${fmtT(t)} のとき<br>y = <span class="ca">${fmt(a)}</span> × ${fmtT(t)}` +
      (b ? ` + <span class="cb">${fmt(b)}</span>` : '') + ` = <span class="y" id="yNow">${fmt(y)}</span>`;
    $('fnote').innerHTML = b === 0
      ? '<span class="tagp">比例</span>b = 0 なので、y は x に<b>比例</b>しています。x が 2倍・3倍になると、y も 2倍・3倍。'
      : '<span class="tagp">一次関数</span>a = 1分で上がる高さ（かたむき）、b = 最初の水（グラフが y じくと交わる所＝切片）';

    // 時間・値
    $('tv').textContent = `x = ${fmtT(t)} 分`;
    $('tR').value = t;
    $('aV').innerHTML = `<span style="color:#B87516">${fmt(a)}</span> cm`;
    $('bV').innerHTML = `<span style="color:#2F7BB0">${fmt(b)}</span> cm`;
    $('aR').value = a; $('bR').value = b;
    $('btnPlay').textContent = S.playing ? '❚❚ とめる' : (t >= G.Xmax ? '↺ もう一度' : '▶ 再生');
    $('btnGhost').disabled = !S.ghost;
  }
  function formulaText(a, b){ return `y=${a === 1 ? '' : fmt(a)}x${b ? '+' + fmt(b) : ''}`; }
  function formulaHTML(a, b){
    return `y = <span class="ca" id="fa">${fmt(a)}</span>x` + (b ? ` + <span class="cb" id="fb">${fmt(b)}</span>` : '');
  }

  /* ---------- 再生 ---------- */
  let last = 0, onEnd = null;
  const SPEED = 1.25;  // 1秒で何分すすむか
  function play(){
    if (S.t >= G.Xmax) S.t = 0;
    S.playing = true; last = performance.now();
    requestAnimationFrame(step); render();
  }
  function pause(){ S.playing = false; render(); }
  function step(now){
    if (!S.playing) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    S.t = Math.min(G.Xmax, S.t + dt * SPEED);
    if (S.t >= G.Xmax){ S.playing = false; render(); if (onEnd){ const f = onEnd; onEnd = null; f(); } return; }
    render(); requestAnimationFrame(step);
  }
  $('btnPlay').addEventListener('click', () => S.playing ? pause() : play());
  $('btnReset').addEventListener('click', () => { S.playing = false; S.t = 0; render(); });
  $('tR').addEventListener('input', e => { S.playing = false; onEnd = null; S.t = +e.target.value; render(); });

  /* ---------- a・b を変える（指をはなす前の線を「くらべる線」に残す） ---------- */
  let committed = {a: S.a, b: S.b}, dragging = false;
  function onParam(key, v){
    if (!dragging){ dragging = true; S.ghost = {...committed}; }
    S[key] = v; render();
  }
  function commit(){
    dragging = false;
    if (S.ghost && S.ghost.a === S.a && S.ghost.b === S.b) S.ghost = null;
    committed = {a: S.a, b: S.b}; render();
  }
  ['aR', 'bR'].forEach(id => {
    const key = id[0];
    $(id).addEventListener('input', e => onParam(key, +e.target.value));
    $(id).addEventListener('change', commit);
  });
  $('btnGhost').addEventListener('click', () => { S.ghost = null; render(); });

  /* ---------- ミッション ---------- */
  const MISSIONS = [
    { q: '水を 2倍の速さで入れたら、グラフはどうなる？',
      base: {a: 2, b: 6}, next: {a: 4, b: 6},
      set: 'いまは「1分で 2cm 上がる」「最初に 6cm 入っている」水そうです。',
      choices: ['線のかたむきが急になる', '線がそのまま上に平行にずれる', '線は変わらない'],
      answer: 0,
      explain: 'a（1分で上がる高さ）が 2 → 4 になりました。グラフのかたむきは a で決まるので、急になります。b＝6 は変わらないので、y じくと交わる点は同じです。' },
    { q: '最初から入っている水を 6cm → 16cm にしたら、グラフはどうなる？',
      base: {a: 2, b: 6}, next: {a: 2, b: 16},
      set: '水を入れる速さ（1分で 2cm）は、そのままです。',
      choices: ['線のかたむきが急になる', '線がそのまま上に平行にずれる', '線が原点を通るようになる'],
      answer: 1,
      explain: 'b（切片）が 10 ふえたので、どの時間でも水面は 10cm 高くなります。かたむき a＝2 は同じなので、線は平行に上へずれます。' },
    { q: '最初の水を 0 にすると、グラフはどこを通る？',
      base: {a: 3, b: 9}, next: {a: 3, b: 0},
      set: 'いまは y = 3x + 9 です。最初の水 b を 9 → 0 にします。',
      choices: ['原点 O（0, 0）を通る', 'y じくの 9 の所を通る', 'x じくの 3 の所を通る'],
      answer: 0,
      explain: 'b＝0 だと y = 3x。x＝0 のとき y＝0 なので原点を通ります。これが「比例」。比例は、一次関数の b＝0 の場合です。' }
  ];
  const done = new Set();
  let cur = -1, picked = -1;
  function drawChips(){
    $('mchips').innerHTML = '';
    MISSIONS.forEach((m, i) => {
      const bt = document.createElement('button');
      bt.className = 'mchip' + (i === cur ? ' active' : '') + (done.has(i) ? ' done' : '');
      bt.textContent = '①②③④⑤'[i];
      bt.setAttribute('aria-label', 'ミッション' + (i + 1));
      bt.addEventListener('click', () => openMission(i));
      $('mchips').appendChild(bt);
    });
  }
  function openMission(i){
    cur = i; picked = -1; onEnd = null;
    const m = MISSIONS[i];
    S.playing = false; S.a = m.base.a; S.b = m.base.b; S.t = G.Xmax; S.ghost = null;
    committed = {...m.base};
    $('mbody').classList.remove('hidden');
    $('mq').textContent = m.q;
    $('mset').textContent = m.set + ' まず予想をえらぼう。';
    $('mresult').classList.add('hidden');
    $('mcheck').disabled = true;
    $('mchoices').innerHTML = '';
    m.choices.forEach((c, k) => {
      const bt = document.createElement('button');
      bt.className = 'choice'; bt.textContent = 'ABC'[k] + '　' + c;
      bt.addEventListener('click', () => {
        picked = k;
        [...$('mchoices').children].forEach((x, j) => x.classList.toggle('picked', j === k));
        $('mcheck').disabled = false;
      });
      $('mchoices').appendChild(bt);
    });
    drawChips(); render();
  }
  $('mcheck').addEventListener('click', () => {
    if (picked < 0) return;
    const m = MISSIONS[cur];
    [...$('mchoices').children].forEach(x => x.disabled = true);
    $('mcheck').disabled = true;
    S.ghost = {...m.base}; S.a = m.next.a; S.b = m.next.b; committed = {...m.next};
    S.t = 0;
    onEnd = () => showResult();
    play();
    document.querySelector('.stage').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  });
  function showResult(){
    const m = MISSIONS[cur], ok = picked === m.answer;
    [...$('mchoices').children].forEach((x, j) => x.classList.toggle('right', j === m.answer));
    done.add(cur); drawChips();
    const r = $('mresult');
    r.innerHTML = `<b>${ok ? '予想どおり！' : '予想とちがった！'}</b>　答えは ${'ABC'[m.answer]}。<br>${m.explain}`;
    r.classList.remove('hidden');
  }
  $('mclose').addEventListener('click', () => { cur = -1; onEnd = null; $('mbody').classList.add('hidden'); drawChips(); });

  /* ============================================================
     章2：反比例（面積 a の長方形。横 x・たて y、 y = a / x）
     左の長方形とグラフは、縦の目もりが同じ（1cm = 8.75px）
     ============================================================ */
  R2 = (function(){
    const P = {
      y0: 236, p: 8.75,         // y=0 の位置、1cm あたりの px（長方形もグラフの縦も同じ）
      rectL: 14,                // 長方形の左はし
      x0: 152, px: 16.5,        // グラフの x=0 の位置、横 1cm あたりの px
      Xmin: 1, Xmax: 12, Ymax: 24,
      COLS: [1, 2, 3, 4, 6, 8, 12]
    };
    const RY = v => P.y0 - P.p * v;
    const RX = x => P.x0 + P.px * x;
    const S2 = { a: 24, x: 3, lo: 3, hi: 3, playing: false, to: P.Xmax, ghost: null };
    const yOf2 = (x, a = S2.a) => a / x;
    const near2 = v => Math.abs(v * 100 - Math.round(v * 100)) < 1e-6;   // 小数第2位までで割り切れる？

    // タイル模様（1cm × 1cm のます目）
    const pat = $('rtile');
    pat.setAttribute('width', P.p); pat.setAttribute('height', P.p);
    pat.setAttribute('patternTransform', `translate(${P.rectL} ${P.y0})`);
    el('path', {d:`M0 0 H${P.p} M0 0 V${P.p}`, stroke:'#16324F', 'stroke-opacity':.28, 'stroke-width':1, fill:'none'}, pat);

    // 方眼とじく
    const g = $('rGrid');
    const mono = {'font-size':9.5, fill:'#5C7996', 'font-family':'Consolas,monospace'};
    for (let v = 0; v <= P.Ymax; v += 2){
      el('line', {x1:P.x0, x2:RX(P.Xmax), y1:RY(v), y2:RY(v), stroke: v ? '#E3ECF3' : '#16324F', 'stroke-width': v ? 1 : 1.5}, g);
      if (v && v % 4 === 0) txt(v, {x:P.x0 - 5, y:RY(v) + 3.5, 'text-anchor':'end', ...mono}, g);
    }
    for (let x = 0; x <= P.Xmax; x++){
      el('line', {x1:RX(x), x2:RX(x), y1:RY(0), y2:RY(P.Ymax), stroke: x ? '#E3ECF3' : '#16324F', 'stroke-width': x ? 1 : 1.5}, g);
      if (x && x % 2 === 0) txt(x, {x:RX(x), y:RY(0) + 13, 'text-anchor':'middle', ...mono}, g);
    }
    txt('y(cm)', {x:P.x0 - 4, y:RY(P.Ymax) - 7, 'text-anchor':'middle', 'font-size':9.5, fill:'#16324F', 'font-weight':700}, g);
    txt('x(cm)', {x:RX(P.Xmax) + 2, y:RY(0) + 26, 'text-anchor':'end', 'font-size':9.5, fill:'#16324F', 'font-weight':700}, g);
    txt('O', {x:P.x0 - 5, y:RY(0) + 13, 'text-anchor':'end', 'font-size':9.5, fill:'#5C7996'}, g);
    // 長方形の側の床と目もり
    el('line', {x1:P.rectL - 4, x2:P.rectL + P.p * P.Xmax + 4, y1:RY(0), y2:RY(0), stroke:'#16324F', 'stroke-width':1.5}, g);
    el('line', {x1:P.rectL, x2:P.rectL, y1:RY(0), y2:RY(P.Ymax), stroke:'#C6D6E3', 'stroke-width':1, 'stroke-dasharray':'2 3'}, g);
    txt('長方形', {x:P.rectL + P.p * P.Xmax / 2, y:RY(0) + 13, 'text-anchor':'middle', 'font-size':10, fill:'#16324F', 'font-weight':700}, g);

    // 長方形
    const gr = $('rRect');
    const rectBase = el('rect', {x:P.rectL, fill:'#FBEED6', id:'rrect'}, gr);
    const rectTile = el('rect', {x:P.rectL, fill:'url(#rtile)'}, gr);
    const rectEdge = el('rect', {x:P.rectL, fill:'none', stroke:'#E0982C', 'stroke-width':2}, gr);
    const areaLbl = txt('', {'font-size':11, fill:'#B87516', 'font-weight':700, 'font-family':'Consolas,monospace'}, gr);

    // グラフ
    const gg = $('rGraph');
    const ghost = el('path', {fill:'none', stroke:'#8AA3BA', 'stroke-width':2, 'stroke-dasharray':'5 4'}, gg);
    const ghostLbl = txt('', {'font-size':9.5, fill:'#5C7996', 'text-anchor':'end'}, gg);
    const area = el('rect', {x:P.x0, fill:'#E0982C', 'fill-opacity':.13, stroke:'#E0982C', 'stroke-width':1, 'stroke-dasharray':'3 3'}, gg);
    const guideH = el('line', {stroke:'#E0982C', 'stroke-width':1.3, 'stroke-dasharray':'3 3'}, gg);
    const trace = el('path', {fill:'none', stroke:'#16324F', 'stroke-width':3, 'stroke-linecap':'round', 'stroke-linejoin':'round', id:'rtrace'}, gg);
    const dot = el('circle', {r:6.5, fill:'#E0982C', stroke:'#fff', 'stroke-width':2, id:'rdot'}, gg);
    const readout = txt('', {x:RX(P.Xmax), y:RY(P.Ymax) - 7, 'text-anchor':'end', 'font-size':11, fill:'#16324F', 'font-weight':700, 'font-family':'Consolas,monospace', id:'rreadout'}, gg);

    function curve(a, x1, x2){
      x1 = Math.max(x1, a / P.Ymax);
      if (x2 <= x1) return '';
      let d = '';
      const n = Math.max(2, Math.ceil((x2 - x1) / 0.05));
      for (let i = 0; i <= n; i++){
        const x = x1 + (x2 - x1) * i / n;
        d += (i ? 'L' : 'M') + RX(x).toFixed(2) + ' ' + RY(a / x).toFixed(2);
      }
      return d;
    }

    // 表
    const tbl = $('rtbl');
    const rows = [['x（cm）', 'x'], ['y（cm）', 'y'], ['x × y', 'p']].map(([h, k]) => {
      const tr = document.createElement('tr');
      if (k === 'p') tr.className = 'prod';
      tr.innerHTML = `<th>${h}</th>`;
      const cells = P.COLS.map(c => { const td = document.createElement('td'); td.dataset.x = c; tr.appendChild(td); return td; });
      tbl.appendChild(tr);
      return cells;
    });
    const fracTxt = (a, x) => near2(a / x) ? fmt(a / x) : `${a}/${x}`;

    function render2(){
      const a = S2.a;
      const x = Math.round(S2.x * 10) / 10;          // 表示は 0.1cm きざみ
      const y = yOf2(x);
      const w = P.p * x, h = P.p * y;

      // 長方形
      [rectBase, rectTile, rectEdge].forEach(r => { r.setAttribute('y', RY(y)); r.setAttribute('width', w); r.setAttribute('height', h); });
      areaLbl.textContent = `${a}cm²`;
      if (w >= 40 && h >= 16){ areaLbl.setAttribute('x', P.rectL + w / 2); areaLbl.setAttribute('y', RY(y / 2) + 4); areaLbl.setAttribute('text-anchor', 'middle'); }
      else if (w < 40){ areaLbl.setAttribute('x', P.rectL + w + 4); areaLbl.setAttribute('y', RY(y / 2) + 4); areaLbl.setAttribute('text-anchor', 'start'); }
      else { areaLbl.setAttribute('x', P.rectL + 2); areaLbl.setAttribute('y', RY(y) - 5); areaLbl.setAttribute('text-anchor', 'start'); }

      // グラフ
      trace.setAttribute('d', curve(a, S2.lo, S2.hi));
      area.setAttribute('y', RY(y)); area.setAttribute('width', P.px * x); area.setAttribute('height', h);
      dot.setAttribute('cx', RX(x)); dot.setAttribute('cy', RY(y));
      guideH.setAttribute('x1', P.rectL + w); guideH.setAttribute('x2', RX(x));
      guideH.setAttribute('y1', RY(y)); guideH.setAttribute('y2', RY(y));
      readout.textContent = `x=${fmtT(x)}  y=${fmt(y)}`;
      if (S2.ghost){
        ghost.setAttribute('d', curve(S2.ghost, P.Xmin, P.Xmax));
        ghostLbl.textContent = `前：y=${S2.ghost}/x`;
        ghostLbl.setAttribute('x', RX(P.Xmax) - 2);
        ghostLbl.setAttribute('y', RY(S2.ghost / P.Xmax) - 6);
        ghost.style.display = ghostLbl.style.display = '';
      } else ghost.style.display = ghostLbl.style.display = 'none';

      // 表
      let exact = P.COLS.indexOf(x), between = -1;
      if (exact < 0) between = P.COLS.findIndex((c, i) => c < x && x < P.COLS[i + 1]);
      P.COLS.forEach((c, i) => {
        rows[0][i].textContent = c;
        rows[1][i].textContent = fracTxt(a, c);
        rows[2][i].textContent = a;
        rows.forEach(r => {
          r[i].classList.toggle('now', i === exact);
          r[i].classList.toggle('near', between >= 0 && (i === between || i === between + 1));
        });
      });
      $('rrate').innerHTML = `x が 2倍・3倍になると、y は 1/2倍・1/3倍。x × y は いつも <b>${a}</b>（比例定数 a）`;

      // 式
      const approx = !near2(y);
      $('rformula').innerHTML = `y = <span class="fr"><span class="ca" id="ra">${a}</span><span>x</span></span>`;
      $('rsubst').innerHTML = `x = ${fmtT(x)} のとき<br>y = <span class="ca">${a}</span> ÷ ${fmtT(x)} ${approx ? '≒' : '='} <span class="y" id="ryNow">${fmt(y)}</span>` +
        `<br>x × y = ${fmtT(x)} × ${approx ? fracTxt(a, fmtT(x)) : fmt(y)} = <span class="ca" id="rprod">${a}</span>`;
      $('rnote').innerHTML = `<span class="tagp">反比例</span>長方形の面積はいつも ${a}cm²。だから横 x が大きくなると、たて y は小さくなります。`;

      $('rtv').textContent = `x = ${fmtT(x)} cm`;
      $('rX').value = S2.x;
      $('raV').innerHTML = `<span style="color:#B87516">${a}</span> cm²`;
      document.querySelectorAll('#rseg .segbtn').forEach(b => b.classList.toggle('active', +b.dataset.a === a));
      $('rPlay').textContent = S2.playing ? '❚❚ とめる' : '▶ 横をのばす';
      $('rGhost').disabled = !S2.ghost;
    }

    // 動かす
    let last = 0, onEnd = null;
    const SPEED = 2.2;   // 1秒で何cm のびるか
    function go(to){
      S2.to = to; S2.playing = true; last = performance.now();
      requestAnimationFrame(step); render2();
    }
    function stop(){ S2.playing = false; render2(); }
    function step(now){
      if (!S2.playing) return;
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      const dir = Math.sign(S2.to - S2.x);
      S2.x = dir > 0 ? Math.min(S2.to, S2.x + dt * SPEED) : Math.max(S2.to, S2.x - dt * SPEED);
      S2.lo = Math.min(S2.lo, S2.x); S2.hi = Math.max(S2.hi, S2.x);
      if (S2.x === S2.to){ S2.playing = false; render2(); if (onEnd){ const f = onEnd; onEnd = null; f(); } return; }
      render2(); requestAnimationFrame(step);
    }
    $('rPlay').addEventListener('click', () => {
      if (S2.playing) return stop();
      if (S2.x >= P.Xmax){ S2.x = P.Xmin; S2.lo = Math.min(S2.lo, S2.x); }
      go(P.Xmax);
    });
    $('rReset').addEventListener('click', () => { S2.playing = false; onEnd = null; S2.x = P.Xmin; S2.lo = Math.min(S2.lo, 1); render2(); });
    $('rX').addEventListener('input', e => {
      S2.playing = false; onEnd = null; S2.x = +e.target.value;
      S2.lo = Math.min(S2.lo, S2.x); S2.hi = Math.max(S2.hi, S2.x); render2();
    });
    function setA(a){
      if (a === S2.a) return;
      S2.ghost = S2.a; S2.a = a; S2.lo = S2.hi = S2.x; render2();
    }
    document.querySelectorAll('#rseg .segbtn').forEach(b => b.addEventListener('click', () => setA(+b.dataset.a)));
    $('rGhost').addEventListener('click', () => { S2.ghost = null; render2(); });

    // ミッション
    const MS = [
      { q: '横を 2倍にすると、たてはどうなる？',
        base: {a: 24, x: 3, lo: 3, hi: 3}, set: '面積 24cm² の長方形。いまは横 3cm、たて 8cm です。横を 3 → 6cm にのばします。',
        choices: ['たても 2倍になる', 'たては 1/2倍になる', 'たては変わらない'], answer: 1,
        run(){ go(6); },
        explain: '横 3 → 6（2倍）で、たては 8 → 4（1/2倍）。面積 x × y＝24 は変わらないので、一方が 2倍になると、もう一方は 1/2倍になります。これが「反比例」です。' },
      { q: '面積を 24 → 12 にすると、グラフはどうなる？',
        base: {a: 24, x: 12, lo: 1, hi: 12}, set: 'いまのグラフは y = 24/x です。面積を半分の 12cm² にして、横を 1cm からのばします。',
        choices: ['原点 O のほうへ近づく（内側）', '外側へ広がる', 'まっすぐな線になる'], answer: 0,
        run(){ S2.ghost = 24; S2.a = 12; S2.x = 1; S2.lo = S2.hi = 1; go(12); },
        explain: '面積が半分なので、同じ x でも y は半分になります。だから曲線は原点 O のほうへ寄ります。a が大きいほど外側、小さいほど内側です。' },
      { q: 'x をどんどん大きくすると、y はいつか 0 になる？',
        base: {a: 24, x: 1, lo: 1, hi: 1}, set: '面積 24cm² の長方形の横を、1cm から 12cm までのばします。',
        choices: ['いつか 0 になる', '0 に近づくが、0 にはならない', 'マイナスになる'], answer: 1,
        run(){ go(12); },
        explain: 'x＝12 で y＝2、x＝24 なら y＝1、x＝240 なら y＝0.1…。x × y＝24 なので、y が 0 になることはありません。グラフは x じくに近づくけれど、交わりません。' }
    ];
    const done = new Set();
    let cur = -1, picked = -1;
    function chips(){
      $('rmchips').innerHTML = '';
      MS.forEach((m, i) => {
        const bt = document.createElement('button');
        bt.className = 'mchip' + (i === cur ? ' active' : '') + (done.has(i) ? ' done' : '');
        bt.textContent = '①②③④⑤'[i];
        bt.setAttribute('aria-label', 'ミッション' + (i + 1));
        bt.addEventListener('click', () => open(i));
        $('rmchips').appendChild(bt);
      });
    }
    function open(i){
      cur = i; picked = -1; onEnd = null; S2.playing = false;
      const m = MS[i];
      Object.assign(S2, m.base, {ghost: null});
      $('rmbody').classList.remove('hidden');
      $('rmq').textContent = m.q;
      $('rmset').textContent = m.set + ' まず予想をえらぼう。';
      $('rmresult').classList.add('hidden');
      $('rmcheck').disabled = true;
      $('rmchoices').innerHTML = '';
      m.choices.forEach((c, k) => {
        const bt = document.createElement('button');
        bt.className = 'choice'; bt.textContent = 'ABC'[k] + '　' + c;
        bt.addEventListener('click', () => {
          picked = k;
          [...$('rmchoices').children].forEach((x, j) => x.classList.toggle('picked', j === k));
          $('rmcheck').disabled = false;
        });
        $('rmchoices').appendChild(bt);
      });
      chips(); render2();
    }
    $('rmcheck').addEventListener('click', () => {
      if (picked < 0) return;
      const m = MS[cur];
      [...$('rmchoices').children].forEach(x => x.disabled = true);
      $('rmcheck').disabled = true;
      onEnd = showResult;
      m.run();
      $('rstage').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    });
    function showResult(){
      const m = MS[cur], ok = picked === m.answer;
      [...$('rmchoices').children].forEach((x, j) => x.classList.toggle('right', j === m.answer));
      done.add(cur); chips();
      const r = $('rmresult');
      r.innerHTML = `<b>${ok ? '予想どおり！' : '予想とちがった！'}</b>　答えは ${'ABC'[m.answer]}。<br>${m.explain}`;
      r.classList.remove('hidden');
    }
    $('rmclose').addEventListener('click', () => { cur = -1; onEnd = null; $('rmbody').classList.add('hidden'); chips(); });

    chips(); render2();
    return {
      P, S: S2, stop, open,
      set(o){ S2.playing = false; onEnd = null; Object.assign(S2, o); render2(); }
    };
  })();

  /* ---------- テスト用の窓口 ---------- */
  window.__FL = {
    VERSION, G, S,
    set(o){ S.playing = false; Object.assign(S, o); committed = {a: S.a, b: S.b}; render(); },
    openMission, setChapter, ch2: R2
  };

  drawChips();
  setChapter(1);
  render();
})();
</script>
</body>
</html>
